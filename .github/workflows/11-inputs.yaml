name: 11- working with inputs

on:
    workflow_dispatch: 
        inputs:
            dry-run:
                type: boolean
                description: Skip deployment and only grant build output
                default: false
            target:
                type: environment
                required: true
                description: which environment the workflow will target
            tag:
                type: choice
                options:
                    - v1
                    - v2
                    - v3
                default: v3
                description: release frim which to build and deploy

jobs:
    Build:
        runs-on: ubuntu-latest
        steps:
            - name: Build
              run: echo "Building from tag ${{inputs.tag}}"
    Deploy:
        runs-on: ubuntu-latest
        if: ${{ !inputs.dry-run}}
        environment: ${{inputs.target}}
        needs: Build
        steps:
            - name: Deploy
              run: echp "Deploying to ${{inputs.target}}"
